name: Publish to PyPI

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate tag is x.x.x
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' is not in x.x.x form — aborting." >&2
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [prepare, checks]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Set version from tag
        run: poetry version "${{ needs.prepare.outputs.version }}"

      - name: Build package
        run: poetry build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/babelfishers/${{ needs.prepare.outputs.version }}/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  docs:
    needs: publish
    permissions:
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml

  release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.version }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes
