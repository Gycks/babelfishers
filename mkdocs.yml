site_name: Babel Fishers
site_url: https://gycks.github.io/babelfishers/
site_description: Localization on your terms. Translate your app without breaking it.
site_author: Guy Clement Kamdem

repo_name: Gycks/babelfishers
repo_url: https://github.com/Gycks/babelfishers
edit_uri: edit/main/docs/

copyright: Copyright &copy; babelfishers

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang:
        - en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - mkdocs-click

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guides:
      - guides/index.md
      - Configuration: guides/configuration.md
      - Translation providers: guides/providers.md
      - Continuous integration: guides/ci.md
      - Glossaries: guides/glossaries.md
      - Translation memory: guides/translation-memory.md
      - Placeholders and protected content: guides/placeholders.md
      - Troubleshooting: guides/troubleshooting.md
  - Formats: formats.md
  - Concepts:
      - concepts/index.md
      - How it works: concepts/how-it-works.md
  - Reference:
      - reference/index.md
      - CLI: reference/cli.md
      - Supported locales: reference/locales.md
  - Changelog: changelog.md
